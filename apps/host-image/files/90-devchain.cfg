# DevChain host image: cloud-init brings up the network (DHCP or the
# hypervisor's network config), grows the disk and sets the host name.
# Everything else the host needs is baked into the image or done by the
# bootstrap service, so user-data commands, passwords, package installs and
# upgrades are not run. The empty users list leaves the image without any
# account: the first free uid belongs to the claim, and until then the
# hypervisor's console is the only way in.
ssh_pwauth: false
disable_root: true
package_update: false
package_upgrade: false
users: []

cloud_init_modules:
  - seed_random
  - growpart
  - resizefs
  - set_hostname
  - update_hostname
  - update_etc_hosts
  - users_groups
  - ssh

cloud_config_modules: []

cloud_final_modules:
  - ssh_authkey_fingerprints
  - keys_to_console
  - final_message
