packages:
  - 'apps/local-app'
  - 'packages/shared'

enablePrePostScripts: true
injectWorkspacePackages: true
nodeLinker: hoisted

allowBuilds:
  '@firebase/util': false
  '@nestjs/core': false
  argon2: false
  bcrypt: false
  better-sqlite3: false
  cpu-features: false
  esbuild: false
  fsevents: false
  nestjs-pino: false
  node-pty: true
  protobufjs: false
  ssh2: false
  unrs-resolver: false
